.hero .l-stars,.hero .l-cloudfar,.hero .l-moon,.hero .l-cloudnear,.hero .l-mount,.hero .l-front,.hero .l-top,.hero .veil,.hero .hint,.hero .s-mist,.hero .s-lights,.hero .s-card,.hero .s-tent,.hero .s-boxes,.hero .s-ground,.hero .bulbs{animation-duration:16s;animation-timing-function:cubic-bezier(.45,0,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
.hero .l-stars{animation-name:k-stars}
.hero .l-cloudfar{animation-name:k-cloudfar}
.hero .l-moon{animation-name:k-moon}
.hero .l-cloudnear{animation-name:k-cloudnear}
.hero .l-mount{animation-name:k-mount}
.hero .l-front{animation-name:k-front}
.hero .l-top{animation-name:k-top}
.hero .veil{animation-name:k-veil}
.hero .hint{animation-name:k-hint}
.hero .s-mist{animation-name:k-mist}
.hero .s-lights{animation-name:k-lights}
.hero .s-card{animation-name:k-card}
.hero .s-tent{animation-name:k-tent}
.hero .s-boxes{animation-name:k-boxes}
.hero .s-ground{animation-name:k-ground}

.hero .treeglow{animation:k-treeon 16s cubic-bezier(.45,0,.25,1) infinite both}

@keyframes k-boxes{0%,50%{transform:translateY(290px)}56%,84%{transform:translateY(0)}89%,100%{transform:translateY(290px)}}

@keyframes k-bulbs{0%,56%{opacity:.26;filter:none}59%,83%{opacity:1;filter:drop-shadow(0 0 9px rgba(242,184,75,.85))}85%,100%{opacity:.26;filter:none}}

.hero .twinkle-b{animation:k-twinkle 4.6s ease-in-out infinite alternate-reverse}
.hero .sleigh{animation:k-sleigh 40s linear -12s infinite}
.hero .deer{position:absolute;width:69px;height:60px;background-image:url(/_blob/81bf0bb53df9c173b12f41e48ff6e22f);background-size:828px 60px;background-repeat:no-repeat;animation:k-run .72s steps(12) infinite}
@keyframes k-run{from{background-position:0 0}to{background-position:-828px 0}}
.hero .sway{animation:k-sway 1.44s ease-in-out infinite alternate}
@keyframes k-sway{from{transform:translateY(-1.5px) rotate(-1deg)}to{transform:translateY(1.5px) rotate(1deg)}}
.hero .drift-a{animation:k-drift 13s ease-in-out infinite alternate}

.hero.is-paused,.hero.is-paused *{animation-play-state:paused !important}

.hero button:focus-visible{outline:3px solid #F2B84B;outline-offset:3px}

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2B84B","options":["#F2B84B","#F08A5D","#7FD1C7"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { playing: true };
this.toggle = () => this.setState({ playing: !this.state.playing });
}
componentDidMount() {
try {
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
this.setState({ playing: false });
}
} catch (e) {}
}
renderVals() {
const playing = !this.state || this.state.playing !== false;
return {
accent: this.props.accent ?? '#F2B84B',
playing: playing,
paused: !playing,
pausedClass: playing ? '' : 'is-paused',
toggle: this.toggle
};
}
}
</script>
